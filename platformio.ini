; Headless build/flash (no Arduino IDE):
;   pipx install platformio
;   pio run -t upload --upload-port /dev/ttyUSB1
[platformio]
src_dir = BTTF_LAMP_CLOCK_HARD_CODED_CREDENTIAL

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel
  https://github.com/avishorp/TM1637.git
  tzapu/WiFiManager
  arduino-libraries/NTPClient
